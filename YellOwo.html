<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@100..900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --text:#0a1628;--text2:#3a5070;--text3:#6a8aaa;
  --accent:#1a6fd4;--sidebar-w:228px;--radius:16px;
}
html,body{height:100%;overflow:hidden;}
body{font-family:'Google Sans Flex',system-ui,sans-serif;background:linear-gradient(135deg,#b8d4f5 0%,#cce3fb 40%,#bcd8f8 70%,#d0e8ff 100%);color:var(--text);display:flex;min-height:100vh;}
  
/*V3.5_Mobile  Mo. de added */
  
/* ── MOBILE OVERLAY ── */
#sideOverlay{display:none;position:fixed;inset:0;background:rgba(10,40,100,.25);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:9;transition:opacity .2s;}
#sideOverlay.open{display:block;}

/* ── HAMBURGER ── */
.menu-btn{display:none;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;border:none;background:rgba(255,255,255,.6);cursor:pointer;flex-shrink:0;}
.menu-btn svg{width:18px;height:18px;stroke:var(--text2);fill:none;stroke-width:2;stroke-linecap:round;}

/* ── SIDEBAR ── */
aside{position:relative;z-index:10;width:var(--sidebar-w);flex-shrink:0;background:rgba(255,255,255,.55);backdrop-filter:blur(28px) saturate(1.8);-webkit-backdrop-filter:blur(28px) saturate(1.8);border-right:1px solid rgba(255,255,255,.7);box-shadow:4px 0 24px rgba(10,40,100,.08);display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.sidebar-top{padding:22px 16px 16px;border-bottom:1px solid rgba(255,255,255,.6);}
.app-badge{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,#1a6fd4,#2ea5ff);color:#fff;font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin-bottom:8px;}
.app-title{font-size:1.05rem;font-weight:700;color:var(--text);letter-spacing:-.02em;}
.subjects-label{padding:12px 16px 5px;font-size:.59rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);}
.subject-list{flex:1;overflow-y:auto;padding:4px 8px;scroll-behavior:smooth;}
.subject-list::-webkit-scrollbar{width:3px;}
.subject-list::-webkit-scrollbar-thumb{background:rgba(26,111,212,.2);border-radius:999px;}
.subj-btn{width:100%;display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;border:none;background:transparent;color:var(--text2);font-family:'Google Sans Flex',sans-serif;font-size:.81rem;font-weight:500;cursor:pointer;transition:background .15s,color .15s;text-align:left;position:relative;margin-bottom:2px;}
.subj-btn:hover{background:rgba(255,255,255,.55);}
.subj-btn.active{background:linear-gradient(135deg,rgba(26,111,212,.18),rgba(46,165,255,.12));color:var(--accent);font-weight:600;box-shadow:0 2px 10px rgba(26,111,212,.15),inset 0 1px 0 rgba(255,255,255,.8);border:1px solid rgba(26,111,212,.2);}
.subj-score{margin-left:auto;font-size:.66rem;font-weight:700;padding:2px 7px;border-radius:999px;flex-shrink:0;}
.subj-del{display:none;position:absolute;right:5px;top:50%;transform:translateY(-50%);background:rgba(220,50,50,.12);border:none;border-radius:5px;color:#cc4444;font-size:.65rem;padding:2px 5px;cursor:pointer;}
.subj-btn:hover .subj-del{display:block;}
.subj-del:hover{background:rgba(220,50,50,.22);}
.add-subj-btn{display:flex;align-items:center;gap:7px;padding:9px 10px;margin:2px 8px 0;border-radius:10px;border:1.5px dashed rgba(26,111,212,.3);background:rgba(26,111,212,.04);color:var(--text3);font-family:'Google Sans Flex',sans-serif;font-size:.79rem;font-weight:500;cursor:pointer;transition:border-color .15s,color .15s;width:calc(100% - 16px);}
.add-subj-btn:hover{border-color:var(--accent);color:var(--accent);}
.sidebar-bottom{padding:10px 8px;border-top:1px solid rgba(255,255,255,.6);display:flex;flex-direction:column;gap:4px;}
.side-btn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;border:none;background:transparent;color:var(--text3);font-family:'Google Sans Flex',sans-serif;font-size:.77rem;font-weight:500;cursor:pointer;transition:background .12s,color .12s;width:100%;text-align:left;}
.side-btn:hover{background:rgba(255,255,255,.55);color:var(--accent);}
.side-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}
.side-btn.star{color:var(--accent);font-weight:600;}
.side-btn.star:hover{background:rgba(26,111,212,.08);}

/* ── MAIN ── */
main{position:relative;z-index:5;flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;min-width:0;}

/* TOPBAR */
.topbar{padding:0 20px;height:56px;display:flex;align-items:center;gap:10px;flex-shrink:0;background:rgba(255,255,255,.5);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border-bottom:1px solid rgba(255,255,255,.65);box-shadow:0 4px 16px rgba(10,40,100,.06);}
.topbar-title{font-size:1.05rem;font-weight:700;letter-spacing:-.02em;color:var(--text);outline:none;cursor:text;padding:3px 8px;border-radius:8px;transition:background .12s;min-width:40px;flex-shrink:0;}
.topbar-title:hover{background:rgba(255,255,255,.6);}
.topbar-title:focus{background:rgba(255,255,255,.8);box-shadow:0 0 0 2px rgba(26,111,212,.3);}
.topbar-pills{display:flex;gap:5px;flex-wrap:nowrap;align-items:center;min-width:0;overflow:hidden;}
.pill{padding:3px 9px;border-radius:999px;font-size:.67rem;font-weight:700;border:1px solid;white-space:nowrap;}
.date-chip{display:flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:.67rem;font-weight:600;color:var(--text2);background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.8);white-space:nowrap;}
.date-chip .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex-shrink:0;}
.topbar-right{margin-left:auto;display:flex;gap:7px;align-items:center;flex-shrink:0;}

/* SEARCH */
.search-wrap{position:relative;display:flex;align-items:center;}
.search-input{padding:5px 26px 5px 28px;border-radius:20px;border:1.5px solid rgba(26,111,212,.2);background:rgba(255,255,255,.65);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-family:'Google Sans Flex',sans-serif;font-size:.75rem;color:var(--text);outline:none;width:155px;transition:width .2s,border-color .15s,background .15s;}
.search-input:focus,.search-input.has-val{width:200px;border-color:var(--accent);background:rgba(255,255,255,.9);}
.search-input::placeholder{color:var(--text3);}
.s-icon{position:absolute;left:8px;width:12px;height:12px;stroke:var(--text3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;}
.s-clear{position:absolute;right:7px;background:none;border:none;cursor:pointer;color:var(--text3);font-size:.78rem;padding:0;line-height:1;display:none;}
.s-clear.vis{display:block;}

/* GLASS BUTTON */
.gbtn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:10px;font-family:'Google Sans Flex',sans-serif;font-size:.74rem;font-weight:600;cursor:pointer;background:rgba(255,255,255,.65);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.85);color:var(--text2);box-shadow:0 2px 8px rgba(10,40,100,.08),inset 0 1px 0 rgba(255,255,255,.9);transition:background .15s,transform .08s;white-space:nowrap;}
.gbtn:hover{background:rgba(255,255,255,.85);}
.gbtn:active{transform:scale(.97);}
.gbtn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.save-dot{width:6px;height:6px;border-radius:50%;background:#34d399;flex-shrink:0;box-shadow:0 0 5px rgba(52,211,153,.5);}
.save-dot.saving{background:#fbbf24;animation:savepulse .5s infinite;}
@keyframes savepulse{0%,100%{opacity:1}50%{opacity:.3}}

/* TOOLBAR */
.toolbar{padding:7px 20px;display:flex;align-items:center;gap:8px;flex-shrink:0;background:rgba(255,255,255,.3);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.5);}
.sort-select{padding:4px 9px;border-radius:8px;border:1.5px solid rgba(26,111,212,.2);background:rgba(255,255,255,.7);font-family:'Google Sans Flex',sans-serif;font-size:.73rem;color:var(--text2);outline:none;cursor:pointer;}
.sort-select:focus{border-color:var(--accent);}
.search-status{font-size:.71rem;color:var(--text3);margin-left:4px;}

/* TABLE AREA */
.table-area{flex:1;overflow:auto;padding:14px 20px 48px;}
.table-area::-webkit-scrollbar{width:5px;height:5px;}
.table-area::-webkit-scrollbar-thumb{background:rgba(26,111,212,.18);border-radius:999px;}

/* LEGEND */
.legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding:7px 14px;background:rgba(255,255,255,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.75);border-radius:12px;box-shadow:0 2px 8px rgba(10,40,100,.06);}
.leg{display:flex;align-items:center;gap:4px;font-size:.67rem;font-weight:500;color:var(--text3);}
.leg-dot{width:8px;height:8px;border-radius:3px;flex-shrink:0;}

/* TABLE */
.tbl-wrap{background:#fff;border:1px solid rgba(255,255,255,.8);border-radius:var(--radius);overflow:hidden;overflow-x:auto;box-shadow:0 8px 32px rgba(10,40,100,.10);}
table{width:100%;border-collapse:collapse;min-width:960px;}
thead th{background:#1e3a5f;color:rgba(255,255,255,.92);font-size:.6rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:10px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid #163050;cursor:pointer;user-select:none;transition:background .12s;}
thead th:hover{background:#26486e;}
thead th.c{text-align:center;}
td{padding:0;border-bottom:1px solid #e8f0fb;vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr.data-row:hover td{filter:brightness(.96);}
tr.hidden-row{display:none;}
mark{background:#fde68a;border-radius:2px;padding:0 1px;}

/* CELLS */
.cell{padding:8px 11px;font-size:.81rem;display:flex;align-items:center;min-height:36px;cursor:text;outline:none;background:inherit;transition:box-shadow .12s;}
.cell.center{justify-content:center;}
.cell.num{font-variant-numeric:tabular-nums;font-weight:600;}
.cell[contenteditable=true]{box-shadow:inset 0 0 0 2px rgba(26,111,212,.5);background:rgba(255,255,255,.85)!important;border-radius:4px;}

/* PCT */
.pct-wrap{display:flex;align-items:center;gap:7px;justify-content:center;padding:8px 11px;}
.pct-bar{width:46px;height:5px;border-radius:999px;background:rgba(26,111,212,.1);overflow:hidden;flex-shrink:0;}
.pct-fill{height:100%;border-radius:999px;transition:width .4s ease;}
.pct-lbl{font-size:.73rem;font-weight:700;min-width:30px;text-align:right;font-variant-numeric:tabular-nums;}

/* SPARX */
.sparx-chip{display:inline-flex;align-items:center;gap:3px;background:rgba(26,111,212,.1);border:1px solid rgba(26,111,212,.25);border-radius:6px;padding:3px 8px;font-family:ui-monospace,monospace;font-size:.73rem;font-weight:600;color:var(--accent);cursor:pointer;transition:background .12s,transform .1s;user-select:none;margin:1px 2px;text-decoration:none;}
.sparx-chip:hover{background:rgba(26,111,212,.2);transform:scale(1.05);box-shadow:0 2px 6px rgba(26,111,212,.2);}
.sparx-chip.copied{background:rgba(52,211,153,.15);border-color:rgba(52,211,153,.4);color:#059669;}
.sparx-chip .ico{font-size:.6rem;opacity:.6;}

/* SPARX PRACTICE */
.sp-cell{display:flex;align-items:center;gap:3px;justify-content:center;padding:5px 8px;}
.sp-cell input{width:34px;padding:3px;border:1.5px solid rgba(26,111,212,.2);border-radius:6px;font-size:.74rem;font-variant-numeric:tabular-nums;text-align:center;background:rgba(255,255,255,.6);color:var(--text);outline:none;-moz-appearance:textfield;}
.sp-cell input::-webkit-outer-spin-button,.sp-cell input::-webkit-inner-spin-button{-webkit-appearance:none;}
.sp-cell input:focus{border-color:var(--accent);background:#fff;}
.sp-div{color:var(--text3);font-weight:700;font-size:.8rem;}
.sp-pct{font-size:.69rem;font-weight:700;min-width:26px;text-align:center;color:var(--text3);}

/* PP */
.pp-wrap{display:flex;justify-content:center;padding:5px;}
.pp-check{appearance:none;-webkit-appearance:none;width:20px;height:20px;border-radius:6px;border:1.5px solid rgba(26,111,212,.25);cursor:pointer;position:relative;transition:background .15s,border-color .15s;}
.pp-check:checked{background:linear-gradient(135deg,#22c55e,#16a34a);border-color:#16a34a;box-shadow:0 2px 6px rgba(34,197,94,.3);}
.pp-check:not(:checked){background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);}
.pp-check::after{content:'';display:none;position:absolute;top:3px;left:6px;width:5px;height:8px;border:2px solid #fff;border-top:none;border-left:none;transform:rotate(45deg);}
.pp-check:checked::after{display:block;}
.pp-check:not(:checked)::before{content:'✕';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:9px;color:rgba(220,50,50,.7);font-weight:700;}

/* SEVERITY */
.sev-badge{display:inline-flex;align-items:center;font-size:.63rem;font-weight:700;padding:1px 6px;border-radius:999px;margin-right:3px;flex-shrink:0;}
.feed-tag{display:inline-block;padding:2px 7px;border-radius:5px;font-size:.68rem;font-weight:500;background:rgba(26,111,212,.08);color:var(--text2);border:1px solid rgba(26,111,212,.12);max-width:170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* DELETE */
.del-btn{background:none;border:none;cursor:pointer;color:rgba(180,180,200,.5);font-size:.8rem;padding:4px 8px;border-radius:5px;transition:color .12s,background .12s;display:flex;align-items:center;justify-content:center;width:100%;height:100%;}
.del-btn:hover{color:#ef4444;background:rgba(239,68,68,.08);}

/* TOTAL ROW */
tr.total-row td{border-top:2px solid #bfdbfe;}
tr.total-row .cell{background:#eff6ff!important;font-weight:700;}
tr.total-row td{background:#eff6ff;}

/* ADD ROW */
.add-row-btn{display:flex;align-items:center;gap:7px;padding:9px 14px;margin-top:10px;background:rgba(255,255,255,.45);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1.5px dashed rgba(26,111,212,.25);border-radius:11px;color:var(--text3);font-family:'Google Sans Flex',sans-serif;font-size:.76rem;font-weight:500;cursor:pointer;transition:border-color .15s,color .15s;width:100%;}
.add-row-btn:hover{border-color:var(--accent);color:var(--accent);}

/* EMPTY */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:12px;text-align:center;}
.empty-state .icon{font-size:2.6rem;}
.empty-state h2{font-size:1.1rem;font-weight:700;color:var(--text);}
.empty-state p{font-size:.79rem;color:var(--text3);max-width:300px;line-height:1.6;}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(180,210,250,.25);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:200;align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:rgba(255,255,255,.88);backdrop-filter:blur(32px) saturate(1.8);-webkit-backdrop-filter:blur(32px) saturate(1.8);border:1px solid rgba(255,255,255,.9);border-radius:20px;padding:26px;width:420px;max-width:92vw;box-shadow:0 24px 64px rgba(10,40,100,.18);}
.modal h3{font-size:.98rem;font-weight:700;margin-bottom:4px;color:var(--text);}
.modal .sub{font-size:.73rem;color:var(--text3);margin-bottom:16px;line-height:1.5;}
.modal input{width:100%;padding:9px 12px;border:1.5px solid rgba(26,111,212,.2);border-radius:10px;background:rgba(255,255,255,.7);color:var(--text);font-family:'Google Sans Flex',sans-serif;font-size:.83rem;outline:none;margin-bottom:12px;}
.modal input:focus{border-color:var(--accent);background:#fff;}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;}
.mbtn{padding:7px 15px;border-radius:9px;font-family:'Google Sans Flex',sans-serif;font-size:.78rem;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,.8);background:rgba(255,255,255,.6);color:var(--text2);}
.mbtn:hover{background:rgba(255,255,255,.9);}
.mbtn.confirm{background:linear-gradient(135deg,#1a6fd4,#2ea5ff);color:#fff;border-color:rgba(46,165,255,.5);box-shadow:0 4px 14px rgba(26,111,212,.3);}
.mbtn.confirm:hover{background:linear-gradient(135deg,#155bb5,#2490e0);}

/* REVISION CARDS */
.rev-card{background:#f0f7ff;border:1px solid #bfdbfe;border-radius:11px;padding:11px 14px;margin-bottom:7px;display:flex;align-items:center;gap:9px;}
.rev-subj{font-size:.64rem;font-weight:700;padding:2px 8px;border-radius:999px;background:#dbeafe;color:#1e40af;flex-shrink:0;white-space:nowrap;}
.rev-topic{font-size:.83rem;font-weight:600;color:#0f172a;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rev-pct{font-size:.71rem;font-weight:700;padding:2px 8px;border-radius:999px;flex-shrink:0;}

/* TOAST */
#toast{position:fixed;bottom:22px;right:22px;z-index:999;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.9);color:var(--text);padding:10px 18px;border-radius:12px;font-size:.76rem;font-weight:600;pointer-events:none;opacity:0;transform:translateY(8px) scale(.97);transition:opacity .2s,transform .2s;box-shadow:0 8px 24px rgba(10,40,100,.15);}
#toast.show{opacity:1;transform:translateY(0) scale(1);}

/* DROP */
#dropOverlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(200,223,247,.3);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:3px dashed rgba(26,111,212,.4);border-radius:16px;margin:8px;align-items:center;justify-content:center;pointer-events:none;flex-direction:column;gap:8px;}
#dropOverlay.active{display:flex;}

/* ── MOBILE CARD VIEW ── */
.card-list{display:none;flex-direction:column;gap:10px;padding:0 0 48px;}
.topic-card{border-radius:13px;border:1px solid rgba(255,255,255,.7);box-shadow:0 2px 10px rgba(10,40,100,.08);overflow:hidden;}
.tc-header{display:flex;align-items:center;gap:8px;padding:10px 13px 8px;font-weight:700;font-size:.88rem;}
.tc-body{padding:8px 13px 10px;display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.tc-field{display:flex;flex-direction:column;gap:2px;}
.tc-label{font-size:.58rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);}
.tc-val{font-size:.81rem;color:var(--text);font-weight:500;}
.tc-wide{grid-column:1/-1;}
.tc-actions{padding:6px 13px 10px;display:flex;gap:7px;align-items:center;}
.tc-pp{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:6px;border:1.5px solid rgba(26,111,212,.25);cursor:pointer;position:relative;flex-shrink:0;transition:background .15s;}
.tc-pp:checked{background:linear-gradient(135deg,#22c55e,#16a34a);border-color:#16a34a;}
.tc-pp:not(:checked){background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);}
.tc-pp::after{content:'';display:none;position:absolute;top:3px;left:7px;width:5px;height:9px;border:2px solid #fff;border-top:none;border-left:none;transform:rotate(45deg);}
.tc-pp:checked::after{display:block;}

/* ── RESPONSIVE BREAKPOINT ── */
@media(max-width:768px){
  :root{--sidebar-w:80vw;}
  html,body{overflow:auto;}
  body{display:block;}

  .menu-btn{display:flex;}

  aside{
    position:fixed;top:0;left:0;height:100vh;z-index:10;
    transform:translateX(-100%);transition:transform .25s ease;
  }
  aside.open{transform:translateX(0);}

  main{height:auto;overflow:visible;min-height:100vh;}

  .topbar{
    position:sticky;top:0;z-index:8;height:auto;min-height:52px;
    padding:10px 14px;gap:8px;flex-wrap:wrap;
  }
  .topbar-title{font-size:.95rem;}
  .topbar-pills{display:none;}
  .topbar-right{margin-left:auto;gap:5px;}

  .search-input{width:130px;}
  .search-input:focus,.search-input.has-val{width:160px;}

  .gbtn span{display:none;}
  .gbtn{padding:6px 10px;}

  .toolbar{padding:6px 1
